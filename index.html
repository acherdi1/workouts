<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Workout Tracker</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #00e676;
      --accent-dim: #004d25;
      --text: #ffffff;
      --subtext: #a0a0a0;
      --border: #2a2a2a;
      --active: #29b6f6;
      --danger: #ff5252;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 90px; }

    header {
      position: sticky; top: 0; background: rgba(30,30,30,0.95);
      backdrop-filter: blur(8px); padding: 12px 16px;
      display: flex; flex-direction: column; gap: 8px;
      border-bottom: 1px solid var(--border); z-index: 10;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
    
    .sync-status {
      font-size: 0.7rem; color: #60a5fa; background: #1e3a8a;
      padding: 3px 8px; border-radius: 12px; cursor: pointer; border: 1px solid #2563eb;
    }

    .nav-tabs { display: flex; gap: 6px; background: #2a2a2a; padding: 3px; border-radius: 8px; }
    .tab-btn {
      background: transparent; border: none; color: var(--subtext);
      padding: 5px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }
    .tab-btn.active { background: var(--card); color: var(--text); }

    .template-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .template-select {
      flex: 1; min-width: 120px; background: #2a2a2a; color: #fff; border: 1px solid var(--border);
      padding: 8px 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 600;
    }
    .btn-small {
      background: #2a2a2a; color: var(--text); border: 1px solid var(--border);
      padding: 8px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer;
    }

    .container { max-width: 600px; margin: 0 auto; padding: 12px; }

    .card {
      background: var(--card); border-radius: 12px; margin-bottom: 14px;
      padding: 14px; border: 1px solid var(--border); position: relative;
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .card-title { font-size: 1rem; font-weight: 700; color: #fff; }
    .card-controls { display: flex; gap: 4px; }
    .icon-btn {
      background: #2a2a2a; border: none; color: var(--text);
      width: 28px; height: 28px; border-radius: 6px; font-size: 0.8rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .icon-btn.danger { color: var(--danger); }

    .set-row {
      display: grid; grid-template-columns: 1fr 1fr 1fr 38px 24px;
      align-items: center; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .set-row:last-child { border-bottom: none; }
    .set-row.completed { opacity: 0.4; text-decoration: line-through; }

    .val-box { background: #2a2a2a; border-radius: 6px; padding: 4px 6px; text-align: center; }
    .val-label { font-size: 0.6rem; color: var(--subtext); display: block; }
    .val-input { width: 100%; background: transparent; border: none; color: #fff; text-align: center; font-size: 0.9rem; font-weight: 600; }

    .check-btn {
      width: 36px; height: 36px; border-radius: 8px; border: 2px solid var(--accent);
      background: transparent; color: var(--accent); font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .completed .check-btn { background: var(--accent); color: #000; }

    .cardno-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
    .note-input { width: 100%; background: #2a2a2a; border: 1px solid var(--border); border-radius: 6px; color: #ddd; padding: 6px 8px; font-size: 0.8rem; margin-top: 4px; }

    .card-actions { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border); }
    .btn-link { background: transparent; border: none; color: var(--active); font-size: 0.8rem; font-weight: 600; cursor: pointer; }

    .action-btn {
      width: 100%; padding: 14px; border-radius: 10px; border: none;
      font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px;
    }
    .btn-finish { background: var(--accent); color: #000; }
    .btn-reset { background: transparent; border: 1px solid var(--danger); color: var(--danger); margin-top: 8px; }
    .btn-add-ex { background: #2a2a2a; color: var(--text); border: 1px dashed var(--subtext); margin-bottom: 12px; }

    /* History View Styling */
    .history-item {
      background: var(--card); border-radius: 12px; padding: 14px;
      margin-bottom: 12px; border: 1px solid var(--border);
    }
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .history-date { font-weight: 700; color: var(--accent); font-size: 0.9rem; }
    .history-details { border-top: 1px solid var(--border); padding-top: 8px; font-size: 0.85rem; color: #ddd; }
    .history-ex-title { font-weight: 600; margin-top: 8px; margin-bottom: 4px; color: var(--active); }
    .history-set-line { padding: 2px 0 2px 8px; color: #ccc; border-left: 2px solid #334155; margin-bottom: 4px; font-size: 0.82rem; }

    /* Floating Rest Timer */
    #timer-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #1e293b; border-top: 2px solid var(--active);
      padding: 10px 16px; display: flex; justify-content: space-between; align-items: center;
      z-index: 100; box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
    }
    .timer-info { display: flex; flex-direction: column; }
    .timer-label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; }
    .timer-time { font-size: 1.5rem; font-weight: 800; color: var(--active); font-family: monospace; }
    .timer-controls { display: flex; gap: 8px; }
    .btn-timer { background: #334155; border: none; color: white; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div>
        <h1>Gym Tracker</h1>
        <span class="sync-status" id="sync-status" onclick="setCloudSyncId()" title="Click to change Cloud Sync ID">☁️ Cloud Active</span>
      </div>
      <div class="nav-tabs">
        <button class="tab-btn active" id="tab-tracker-btn" onclick="switchTab('tracker')">Workout</button>
        <button class="tab-btn" id="tab-history-btn" onclick="switchTab('history')">History</button>
      </div>
    </div>
    <div class="template-bar" id="template-bar">
      <select class="template-select" id="template-select" onchange="changeTemplate(this.value)"></select>
      <button class="btn-small" onclick="createNewTemplate()">+ New</button>
      <button class="btn-small" onclick="renameCurrentTemplate()">✎ Rename</button>
    </div>
  </header>

  <div class="container" id="view-tracker">
    <div id="workout-list"></div>
    <button class="action-btn btn-add-ex" onclick="addExercise()">+ Add Exercise</button>
    <button class="action-btn btn-finish" onclick="finishWorkout()">Finish & Save Workout</button>
    <button class="action-btn btn-reset" onclick="resetWorkout()">Reset Unsaved Checks</button>
  </div>

  <div class="container" id="view-history" style="display: none;">
    <div id="history-list"></div>
  </div>

  <div id="timer-bar">
    <div class="timer-info">
      <span class="timer-label" id="timer-label">Rest Timer</span>
      <span class="timer-time" id="timer-display">00:00</span>
    </div>
    <div class="timer-controls">
      <button class="btn-timer" onclick="adjustTimer(+30)">+30s</button>
      <button class="btn-timer" onclick="stopTimer()">Skip</button>
    </div>
  </div>

  <script>
    const defaultTemplates = {
      "Pull-ups": [
        { name: "Warmup", cardio: true, text: "Warmup routine" },
        {
          name: "Pull-ups (Bodyweight)",
          sets: [
            { weight: 0, reps: 5, pause: 120, done: false, note: "" },
            { weight: 0, reps: 22, pause: 180, done: false, note: "shoulders dow chest front only chin over, no more" }
          ]
        },
        {
          name: "Weights 15kg",
          sets: [
            { weight: 15, reps: 5, pause: 180, done: false, note: "" },
            { weight: 15, reps: 5, pause: 180, done: false, note: "" },
            { weight: 15, reps: 5, pause: 180, done: false, note: "" }
          ]
        },
        {
          name: "Forehead + Weights?",
          sets: [
            { weight: 0, reps: 5, pause: 120, done: false, note: "" },
            { weight: 0, reps: 5, pause: 120, done: false, note: "" },
            { weight: 0, reps: 5, pause: 120, done: false, note: "" }
          ]
        },
        {
          name: "Ex on serpente",
          sets: [
            { weight: 0, reps: 3, pause: 120, done: false, note: "up chest per elbows in!! With a ladder" },
            { weight: 0, reps: 3, pause: 120, done: false, note: "up chest per elbows in!! With a ladder" },
            { weight: 0, reps: 3, pause: 120, done: false, note: "up chest per elbows in!! With a ladder" }
          ]
        }
      ],
      "Glutes A": [
        { name: "Warmup Walk", cardio: true, text: "Light walking - 5 min" },
        {
          name: "Hip Thrust",
          sets: [
            { weight: 0, reps: 10, pause: 180, done: false, note: "" },
            { weight: 20, reps: 8, pause: 180, done: false, note: "+10+10" },
            { weight: 30, reps: 8, pause: 180, done: false, note: "+5+5" },
            { weight: 40, reps: 8, pause: 180, done: false, note: "+5+5" },
            { weight: 40, reps: 6, pause: 180, done: false, note: "" },
            { weight: 35, reps: 8, pause: 180, done: false, note: "" }
          ]
        },
        {
          name: "Smith Machine",
          sets: [
            { weight: 10, reps: 5, pause: 60, done: false, note: "" },
            { weight: 30, reps: 8, pause: 180, done: false, note: "" },
            { weight: 30, reps: 8, pause: 180, done: false, note: "" },
            { weight: 30, reps: 8, pause: 180, done: false, note: "" }
          ]
        },
        {
          name: "Romanian Deadlift",
          sets: [
            { weight: 10, reps: 5, pause: 60, done: false, note: "" },
            { weight: 30, reps: 8, pause: 180, done: false, note: "" },
            { weight: 30, reps: 8, pause: 180, done: false, note: "" },
            { weight: 30, reps: 8, pause: 180, done: false, note: "" }
          ]
        },
        {
          name: "Bulgarian Split Squat",
          sets: [
            { weight: 0, reps: 8, pause: 120, done: false, note: "" },
            { weight: 0, reps: 8, pause: 120, done: false, note: "" }
          ]
        },
        {
          name: "Abduction",
          sets: [
            { weight: 29, reps: 20, pause: 60, done: false, note: "" },
            { weight: 36, reps: 20, pause: 60, done: false, note: "" },
            { weight: 36, reps: 15, pause: 0, done: false, note: "" }
          ]
        },
        { name: "Cool-down Walk", cardio: true, text: "Walk 10min | 4km/h | 5% incline" }
      ],
      "Glutes B": [
        { name: "Warmup Walk", cardio: true, text: "Light walking - 5 min" },
        {
          name: "Romanian Deadlift",
          sets: [
            { weight: 10, reps: 5, pause: 60, done: false, note: "" },
            { weight: 30, reps: 10, pause: 180, done: false, note: "" },
            { weight: 30, reps: 10, pause: 180, done: false, note: "" },
            { weight: 30, reps: 10, pause: 180, done: false, note: "" }
          ]
        },
        {
          name: "Hip Thrust",
          sets: [
            { weight: 0, reps: 10, pause: 180, done: false, note: "" },
            { weight: 20, reps: 8, pause: 180, done: false, note: "" },
            { weight: 30, reps: 10, pause: 150, done: false, note: "" },
            { weight: 30, reps: 10, pause: 150, done: false, note: "" },
            { weight: 30, reps: 10, pause: 150, done: false, note: "" }
          ]
        },
        {
          name: "Leg Press (feet high & wide)",
          sets: [
            { weight: 0, reps: 12, pause: 120, done: false, note: "Find weight" },
            { weight: 0, reps: 12, pause: 120, done: false, note: "Same weight" },
            { weight: 0, reps: 12, pause: 120, done: false, note: "Same weight" }
          ]
        },
        {
          name: "Reverse Lunges",
          sets: [
            { weight: 0, reps: 10, pause: 120, done: false, note: "Each leg" },
            { weight: 0, reps: 10, pause: 120, done: false, note: "Each leg" },
            { weight: 0, reps: 10, pause: 120, done: false, note: "Each leg" }
          ]
        },
        {
          name: "Abduction",
          sets: [
            { weight: 36, reps: 20, pause: 60, done: false, note: "15-20 reps" },
            { weight: 36, reps: 20, pause: 60, done: false, note: "15-20 reps" },
            { weight: 36, reps: 20, pause: 60, done: false, note: "15-20 reps" }
          ]
        },
        { name: "Cool-down Walk", cardio: true, text: "Walk 15–20 min | 4 km/h | 5% incline" }
      ]
    };

    let workoutTemplates = JSON.parse(localStorage.getItem('workoutTemplates')) || defaultTemplates;
    let activeTemplateKey = localStorage.getItem('activeTemplateKey') || 'Pull-ups';
    let workoutHistory = JSON.parse(localStorage.getItem('workoutHistory')) || [];
    let cloudSyncId = localStorage.getItem('cloudSyncId') || 'my-gym-tracker-sync-key';
    
    let timerInterval = null;
    let secondsLeft = 0;
    let audioCtx = null;

    if (!workoutTemplates[activeTemplateKey]) {
      activeTemplateKey = Object.keys(workoutTemplates)[0] || 'Pull-ups';
    }

    /* Native Cloud Database Sync Logic (Firebase REST Endpoint) */
    const DB_BASE_URL = 'https://gym-tracker-cloud-default-rtdb.firebaseio.com/users';

    async function pushToCloud() {
      const statusEl = document.getElementById('sync-status');
      if (statusEl) statusEl.innerText = "☁️ Saving...";
      const data = {
        workoutTemplates,
        activeTemplateKey,
        workoutHistory,
        updatedAt: Date.now()
      };
      try {
        await fetch(`${DB_BASE_URL}/${cloudSyncId}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (statusEl) statusEl.innerText = `☁️ Synced (${cloudSyncId})`;
      } catch (err) {
        if (statusEl) statusEl.innerText = "☁️ Local Only";
      }
    }

    async function fetchFromCloud() {
      const statusEl = document.getElementById('sync-status');
      if (statusEl) statusEl.innerText = "☁️ Syncing...";
      try {
        const res = await fetch(`${DB_BASE_URL}/${cloudSyncId}.json`);
        const data = await res.json();
        if (data && data.workoutTemplates) {
          workoutTemplates = data.workoutTemplates;
          activeTemplateKey = data.activeTemplateKey || Object.keys(workoutTemplates)[0];
          workoutHistory = data.workoutHistory || [];
          localStorage.setItem('workoutTemplates', JSON.stringify(workoutTemplates));
          localStorage.setItem('activeTemplateKey', activeTemplateKey);
          localStorage.setItem('workoutHistory', JSON.stringify(workoutHistory));
          renderTracker();
          if (document.getElementById('view-history').style.display !== 'none') {
            renderHistory();
          }
          if (statusEl) statusEl.innerText = `☁️ Synced (${cloudSyncId})`;
        } else {
          pushToCloud();
        }
      } catch (err) {
        if (statusEl) statusEl.innerText = "☁️ Local Only";
      }
    }

    function setCloudSyncId() {
      const input = prompt("Enter your shared Cloud Sync ID (e.g. myworkout123).\nUse the EXACT SAME ID on your phone and desktop to keep them synced automatically:", cloudSyncId);
      if (input && input.trim() !== "") {
        cloudSyncId = input.trim().replace(/[^a-zA-Z0-9_-]/g, "");
        localStorage.setItem('cloudSyncId', cloudSyncId);
        fetchFromCloud();
      }
    }

    function saveTemplates() {
      localStorage.setItem('workoutTemplates', JSON.stringify(workoutTemplates));
      localStorage.setItem('activeTemplateKey', activeTemplateKey);
      pushToCloud();
    }

    function saveHistoryState() {
      localStorage.setItem('workoutHistory', JSON.stringify(workoutHistory));
      pushToCloud();
    }

    function switchTab(tab) {
      document.getElementById('view-tracker').style.display = tab === 'tracker' ? 'block' : 'none';
      document.getElementById('view-history').style.display = tab === 'history' ? 'block' : 'none';
      document.getElementById('template-bar').style.display = tab === 'tracker' ? 'flex' : 'none';
      document.getElementById('tab-tracker-btn').classList.toggle('active', tab === 'tracker');
      document.getElementById('tab-history-btn').classList.toggle('active', tab === 'history');
      if (tab === 'history') renderHistory();
    }

    function changeTemplate(name) {
      activeTemplateKey = name;
      saveTemplates();
      renderTracker();
    }

    function createNewTemplate() {
      const name = prompt("Enter new workout template name:");
      if (name && name.trim() !== '') {
        const trimmed = name.trim();
        if (!workoutTemplates[trimmed]) {
          workoutTemplates[trimmed] = [
            { name: "Sample Exercise", sets: [{ weight: 0, reps: 10, pause: 120, done: false, note: "" }] }
          ];
          activeTemplateKey = trimmed;
          saveTemplates();
          renderTemplateSelect();
          renderTracker();
        } else {
          alert("A template with this name already exists!");
        }
      }
    }

    function renameCurrentTemplate() {
      const oldName = activeTemplateKey;
      const newName = prompt("Enter new name for current template:", oldName);
      if (newName && newName.trim() !== '' && newName.trim() !== oldName) {
        const trimmed = newName.trim();
        if (workoutTemplates[trimmed]) {
          alert("A template with this name already exists!");
          return;
        }
        workoutTemplates[trimmed] = workoutTemplates[oldName];
        delete workoutTemplates[oldName];
        activeTemplateKey = trimmed;
        saveTemplates();
        renderTemplateSelect();
        renderTracker();
      }
    }

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function beep() {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.8);

      if ("vibrate" in navigator) {
        navigator.vibrate([200, 100, 200, 100, 400]);
      }
    }

    function startTimer(seconds) {
      initAudio();
      if (seconds <= 0) return;
      clearInterval(timerInterval);
      secondsLeft = Math.round(seconds);
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        secondsLeft--;
        updateTimerDisplay();
        if (secondsLeft <= 0) {
          clearInterval(timerInterval);
          beep();
          document.getElementById('timer-label').innerText = "REST DONE!";
        }
      }, 1000);
    }

    function adjustTimer(sec) {
      secondsLeft = Math.max(0, secondsLeft + sec);
      updateTimerDisplay();
    }

    function stopTimer() {
      clearInterval(timerInterval);
      secondsLeft = 0;
      updateTimerDisplay();
      document.getElementById('timer-label').innerText = "REST TIMER";
    }

    function updateTimerDisplay() {
      const m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
      const s = (secondsLeft % 60).toString().padStart(2, '0');
      document.getElementById('timer-display').innerText = `${m}:${s}`;
      if (secondsLeft > 0) {
        document.getElementById('timer-label').innerText = "RESTING...";
      }
    }

    function toggleSet(exIdx, setIdx) {
      const set = workoutTemplates[activeTemplateKey][exIdx].sets[setIdx];
      set.done = !set.done;
      saveTemplates();
      renderTracker();

      if (set.done && set.pause > 0) {
        startTimer(set.pause);
      }
    }

    function updateVal(exIdx, setIdx, field, value) {
      workoutTemplates[activeTemplateKey][exIdx].sets[setIdx][field] = field === 'note' ? value : Number(value);
      saveTemplates();
    }

    function updateCardioText(exIdx, value) {
      workoutTemplates[activeTemplateKey][exIdx].text = value;
      saveTemplates();
    }

    function updateExName(exIdx, value) {
      workoutTemplates[activeTemplateKey][exIdx].name = value;
      saveTemplates();
    }

    function moveExercise(exIdx, dir) {
      const list = workoutTemplates[activeTemplateKey];
      const targetIdx = exIdx + dir;
      if (targetIdx < 0 || targetIdx >= list.length) return;
      const temp = list[exIdx];
      list[exIdx] = list[targetIdx];
      list[targetIdx] = temp;
      saveTemplates();
      renderTracker();
    }

    function addExercise() {
      const isCardio = confirm("Click OK for Cardio/Note item, or Cancel for Weight/Strength exercise.");
      const name = prompt("Exercise Name:", isCardio ? "Warmup Walk" : "New Exercise");
      if (!name) return;

      if (isCardio) {
        workoutTemplates[activeTemplateKey].push({ name: name, cardio: true, text: "5 min warm-up" });
      } else {
        workoutTemplates[activeTemplateKey].push({
          name: name,
          sets: [{ weight: 10, reps: 10, pause: 120, done: false, note: "" }]
        });
      }
      saveTemplates();
      renderTracker();
    }

    function deleteExercise(exIdx) {
      if (confirm("Delete this exercise from template?")) {
        workoutTemplates[activeTemplateKey].splice(exIdx, 1);
        saveTemplates();
        renderTracker();
      }
    }

    function addSet(exIdx) {
      const sets = workoutTemplates[activeTemplateKey][exIdx].sets;
      const lastSet = sets[sets.length - 1] || { weight: 10, reps: 10, pause: 120, note: "" };
      sets.push({ ...lastSet, done: false });
      saveTemplates();
      renderTracker();
    }

    function deleteSet(exIdx, setIdx) {
      const sets = workoutTemplates[activeTemplateKey][exIdx].sets;
      if (sets.length <= 1) {
        alert("An exercise must have at least one set.");
        return;
      }
      sets.splice(setIdx, 1);
      saveTemplates();
      renderTracker();
    }

    function resetWorkout() {
      if (confirm("Reset current checkmarks?")) {
        workoutTemplates[activeTemplateKey].forEach(ex => {
          if (ex.sets) ex.sets.forEach(s => s.done = false);
        });
        saveTemplates();
        stopTimer();
        renderTracker();
      }
    }

    function finishWorkout() {
      let completedSetsCount = 0;
      const historyEntry = {
        id: Date.now(),
        templateName: activeTemplateKey,
        date: new Date().toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
        exercises: []
      };

      workoutTemplates[activeTemplateKey].forEach(ex => {
        if (ex.cardio) return;
        const doneSets = ex.sets.filter(s => s.done);
        if (doneSets.length > 0) {
          historyEntry.exercises.push({
            name: ex.name,
            sets: doneSets.map(s => {
              completedSetsCount++;
              return `${s.weight}kg × ${s.reps} reps | ${s.pause}s${s.note ? ' — ' + s.note : ''}`;
            })
          });
        }
      });

      if (completedSetsCount === 0) {
        alert("Please mark at least one set as completed before saving!");
        return;
      }

      workoutHistory.unshift(historyEntry);
      saveHistoryState();

      // Clear checkmarks for next session
      workoutTemplates[activeTemplateKey].forEach(ex => {
        if (ex.sets) ex.sets.forEach(s => s.done = false);
      });
      saveTemplates();
      stopTimer();
      renderTracker();

      alert("Workout saved to History!");
      switchTab('history');
    }

    function deleteHistoryItem(id) {
      if (confirm("Delete this log from history?")) {
        workoutHistory = workoutHistory.filter(item => item.id !== id);
        saveHistoryState();
        renderHistory();
      }
    }

    function renderTemplateSelect() {
      const select = document.getElementById('template-select');
      select.innerHTML = Object.keys(workoutTemplates).map(name => `
        <option value="${name}" ${name === activeTemplateKey ? 'selected' : ''}>${name}</option>
      `).join('');
    }

    function renderTracker() {
      renderTemplateSelect();
      const container = document.getElementById('workout-list');
      container.innerHTML = '';

      const currentList = workoutTemplates[activeTemplateKey] || [];

      currentList.forEach((ex, exIdx) => {
        const card = document.createElement('div');
        card.className = 'card';

        let html = `
          <div class="card-header">
            <input type="text" class="card-title" style="background:transparent; border:none; width:70%;" 
              value="${ex.name}" onchange="updateExName(${exIdx}, this.value)">
            <div class="card-controls">
              <button class="icon-btn" onclick="moveExercise(${exIdx}, -1)">▲</button>
              <button class="icon-btn" onclick="moveExercise(${exIdx}, 1)">▼</button>
              <button class="icon-btn danger" onclick="deleteExercise(${exIdx})">✕</button>
            </div>
          </div>
        `;

        if (ex.cardio) {
          html += `
            <div class="cardno-row">
              <input type="text" class="note-input" value="${ex.text}" 
                onchange="updateCardioText(${exIdx}, this.value)" placeholder="Cardio details...">
            </div>
          `;
        } else {
          ex.sets.forEach((set, setIdx) => {
            html += `
              <div class="set-row ${set.done ? 'completed' : ''}">
                <div class="val-box">
                  <span class="val-label">KG</span>
                  <input type="number" class="val-input" value="${set.weight}" 
                    onchange="updateVal(${exIdx}, ${setIdx}, 'weight', this.value)">
                </div>
                <div class="val-box">
                  <span class="val-label">REPS</span>
                  <input type="number" class="val-input" value="${set.reps}" 
                    onchange="updateVal(${exIdx}, ${setIdx}, 'reps', this.value)">
                </div>
                <div class="val-box">
                  <span class="val-label">REST(s)</span>
                  <input type="number" step="5" class="val-input" value="${set.pause}" 
                    onchange="updateVal(${exIdx}, ${setIdx}, 'pause', this.value)">
                </div>
                <button class="check-btn" onclick="toggleSet(${exIdx}, ${setIdx})">
                  ${set.done ? '✓' : ''}
                </button>
                <button class="icon-btn danger" style="width:20px; height:20px; font-size:0.6rem;" 
                  onclick="deleteSet(${exIdx}, ${setIdx})">✕</button>
              </div>
              <div style="padding: 0 0 4px 0;">
                <input type="text" class="note-input" value="${set.note || ''}" placeholder="Note (optional)"
                  onchange="updateVal(${exIdx}, ${setIdx}, 'note', this.value)">
              </div>
            `;
          });

          html += `
            <div class="card-actions">
              <button class="btn-link" onclick="addSet(${exIdx})">+ Add Set</button>
            </div>
          `;
        }

        card.innerHTML = html;
        container.appendChild(card);
      });
    }

    function renderHistory() {
      const container = document.getElementById('history-list');
      if (workoutHistory.length === 0) {
        container.innerHTML = `<p style="text-align:center; color: var(--subtext); margin-top: 40px;">No workout history logged yet.</p>`;
        return;
      }

      container.innerHTML = workoutHistory.map(item => `
        <div class="history-item">
          <div class="history-header">
            <span class="history-date">${item.templateName || 'Workout'} - ${item.date}</span>
            <button class="icon-btn danger" style="width:24px; height:24px;" onclick="deleteHistoryItem(${item.id})">✕</button>
          </div>
          <div class="history-details">
            ${item.exercises.map(ex => `
              <div class="history-ex-title">${ex.name}</div>
              <div>
                ${ex.sets.map(s => `<div class="history-set-line">• ${s}</div>`).join('')}
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    // Auto-sync on window focus
    window.addEventListener('focus', fetchFromCloud);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') fetchFromCloud();
    });

    renderTracker();
    fetchFromCloud();
  </script>
</body>
</html>

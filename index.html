<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Workout Tracker</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #00e676;
      --accent-dim: #004d25;
      --text: #ffffff;
      --subtext: #a0a0a0;
      --border: #2a2a2a;
      --active: #29b6f6;
      --warning: #f59e0b;
      --danger: #ff5252;
      --timer-bg: #1e293b;
      --timer-progress: #0284c7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 110px; }

    header {
      position: sticky; top: 0; background: rgba(30,30,30,0.95);
      backdrop-filter: blur(8px); padding: 12px 16px;
      display: flex; flex-direction: column; gap: 8px;
      border-bottom: 1px solid var(--border); z-index: 10;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
    
    .sync-bar { 
      display: flex; gap: 8px; align-items: center; justify-content: space-between;
      flex-wrap: wrap; background: #1a1a1a; padding: 10px 12px;
      border-radius: 10px; border: 1px solid var(--border); margin-bottom: 14px;
    }
    .sync-status {
      font-size: 0.75rem; color: #60a5fa; background: #1e3a8a;
      padding: 4px 10px; border-radius: 12px; border: 1px solid #2563eb; font-weight: 600;
    }
    .btn-file {
      background: #334155; color: #fff; border: 1px solid var(--border); padding: 6px 10px;
      border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer;
    }

    .nav-tabs { display: flex; gap: 6px; background: #2a2a2a; padding: 3px; border-radius: 8px; }
    .tab-btn {
      background: transparent; border: none; color: var(--subtext);
      padding: 5px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }
    .tab-btn.active { background: var(--card); color: var(--text); }

    .template-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .template-select {
      flex: 1; min-width: 120px; background: #2a2a2a; color: #fff; border: 1px solid var(--border);
      padding: 8px 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 600;
    }
    .btn-small {
      background: #2a2a2a; color: var(--text); border: 1px solid var(--border);
      padding: 8px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer;
    }

    .timing-summary {
      font-size: 0.78rem; color: var(--active); background: #112233;
      padding: 6px 10px; border-radius: 6px; border: 1px solid #1e3a8a;
      display: flex; justify-content: space-between; font-weight: 600;
    }

    .start-banner {
      background: #1e2a1e; border: 1px solid #2e5a2e; border-radius: 10px;
      padding: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
    }
    .start-banner.active { background: #12283a; border-color: #1e4b7a; }
    .start-info { font-size: 0.85rem; font-weight: 600; }
    .btn-start {
      background: var(--accent); color: #000; border: none; padding: 8px 14px;
      border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer;
    }

    .container { max-width: 600px; margin: 0 auto; padding: 12px; }

    .card {
      background: var(--card); border-radius: 12px; margin-bottom: 14px;
      padding: 14px; border: 1px solid var(--border); position: relative;
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .card-title { font-size: 1rem; font-weight: 700; color: #fff; }
    .card-controls { display: flex; gap: 4px; }
    .icon-btn {
      background: #2a2a2a; border: none; color: var(--text);
      width: 28px; height: 28px; border-radius: 6px; font-size: 0.8rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .icon-btn.danger { color: var(--danger); }

    .ex-comment-input, .note-textarea {
      width: 100%; background: #161616; border: 1px solid #333; border-radius: 6px;
      color: #7dd3fc; padding: 6px 8px; font-size: 0.8rem; font-style: italic;
      resize: vertical; min-height: 40px; max-height: 120px; overflow-y: auto; touch-action: pan-y;
      font-family: inherit; margin-bottom: 8px;
    }

    .set-row {
      display: grid; grid-template-columns: 24px 1fr 1fr 1fr 36px 24px;
      align-items: center; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .set-row:last-child { border-bottom: none; }
    .set-row.completed { opacity: 0.4; text-decoration: line-through; }

    .val-box { background: #2a2a2a; border-radius: 6px; padding: 4px 6px; text-align: center; }
    .val-label { font-size: 0.6rem; color: var(--subtext); display: block; }
    .val-input { width: 100%; background: transparent; border: none; color: #fff; text-align: center; font-size: 0.9rem; font-weight: 600; }

    .check-btn {
      width: 36px; height: 36px; border-radius: 8px; border: 2px solid var(--accent);
      background: transparent; color: var(--accent); font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .completed .check-btn { background: var(--accent); color: #000; }

    .card-actions { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border); }
    .btn-link { background: transparent; border: none; color: var(--active); font-size: 0.8rem; font-weight: 600; cursor: pointer; }

    .action-btn {
      width: 100%; padding: 14px; border-radius: 10px; border: none;
      font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px;
    }
    .btn-finish { background: var(--accent); color: #000; }
    .btn-reset { background: transparent; border: 1px solid var(--danger); color: var(--danger); margin-top: 8px; }
    .btn-add-ex { background: #2a2a2a; color: var(--text); border: 1px dashed var(--subtext); margin-bottom: 12px; }

    .history-item {
      background: var(--card); border-radius: 12px; padding: 14px;
      margin-bottom: 12px; border: 1px solid var(--border);
    }
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .history-date { font-weight: 700; color: var(--accent); font-size: 0.9rem; }
    .history-duration { font-size: 0.75rem; color: var(--subtext); margin-bottom: 8px; }
    .history-details { border-top: 1px solid var(--border); padding-top: 8px; font-size: 0.85rem; color: #ddd; }
    .history-ex-title { font-weight: 600; margin-top: 8px; margin-bottom: 2px; color: var(--active); display: flex; justify-content: space-between; align-items: center; }
    .history-ex-comment { font-size: 0.75rem; color: #94a3b8; font-style: italic; margin-bottom: 4px; white-space: pre-wrap; }
    .history-set-line { padding: 2px 0 2px 8px; color: #ccc; border-left: 2px solid #334155; margin-bottom: 4px; font-size: 0.82rem; white-space: pre-wrap; }

    /* Timer Bar Styles */
    #timer-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: linear-gradient(to right, var(--timer-progress) 0%, var(--timer-bg) 0%);
      border-top: 2px solid var(--active);
      padding: 10px 16px; display: flex; justify-content: space-between; align-items: center;
      z-index: 100; box-shadow: 0 -4px 15px rgba(0,0,0,0.5); transition: background 0.2s ease, border-color 0.2s ease;
    }
    #timer-bar.timer-warning {
      border-top-color: var(--warning);
    }
    #timer-bar.timer-done {
      border-top-color: var(--danger);
      background: #3b1111 !important;
    }
    .timer-info { display: flex; flex-direction: column; }
    .timer-label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; font-weight: 700; }
    .timer-warning .timer-label { color: var(--warning); }
    .timer-done .timer-label { color: var(--danger); }
    
    .timer-time { font-size: 1.5rem; font-weight: 800; color: var(--active); font-family: monospace; }
    .timer-warning .timer-time { color: var(--warning); }
    .timer-done .timer-time { color: var(--danger); }

    .timer-controls { display: flex; gap: 8px; }
    .btn-timer { background: #334155; border: none; color: white; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 200;
    }
    .modal-card {
      background: var(--card); border-radius: 12px; border: 1px solid var(--border);
      padding: 20px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 12px;
    }
    .modal-title { font-weight: 700; font-size: 1.05rem; color: var(--accent); }
    .modal-btn {
      padding: 10px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 0.9rem;
    }
    .modal-btn.primary { background: var(--accent); color: #000; }
    .modal-btn.secondary { background: #334155; color: #fff; }
    .modal-btn.cancel { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
  </style>

  <!-- Firebase Web SDK Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script></head><body>

  <header>
    <div class="header-top">
      <h1>Gym Tracker</h1>
      <div class="nav-tabs">
        <button class="tab-btn active" id="tab-tracker-btn" onclick="switchTab('tracker')">Workout</button>
        <button class="tab-btn" id="tab-history-btn" onclick="switchTab('history')">History</button>
      </div>
    </div>
    <div class="template-bar" id="template-bar">
      <select class="template-select" id="template-select" onchange="changeTemplate(this.value)"></select>
      <button class="btn-small" onclick="showNewTemplateModal()">+ New</button>
      <button class="btn-small" onclick="renameCurrentTemplate()">✎ Rename</button>
      <button class="btn-small" onclick="deleteCurrentTemplate()">🗑 Delete</button>
      <button class="btn-small" onclick="copyWorkoutAsText()">📋 Copy Text</button>
    </div>
    <div class="timing-summary" id="timing-summary">
      <span>Planned Rest: <b id="sum-planned-rest">0m</b></span>
      <span>Est. Next Workout: <b id="sum-total-workout">N/A</b></span>
    </div>
  </header>

  <div class="container" id="view-tracker">
    <div class="start-banner" id="start-banner">
      <div class="start-info" id="start-info">Workout Status: Not Started</div>
      <button class="btn-start" id="btn-start-toggle" onclick="toggleWorkoutStart()">Start Workout</button>
    </div>

    <div id="workout-list"></div>
    <button class="action-btn btn-add-ex" onclick="showAddExModal()">+ Add Exercise</button>
    <button class="action-btn btn-finish" onclick="finishWorkout()">Finish & Save Workout</button>
    <button class="action-btn btn-reset" onclick="resetWorkout()">Reset Unsaved Checks</button>
  </div>

  <div class="container" id="view-history" style="display: none;">
    <div class="sync-bar">
      <span class="sync-status" id="sync-status">🔥 Firebase: Initializing...</span>
      <div>
        <button class="btn-file" onclick="exportToFile()">📥 Export JSON</button>
        <button class="btn-file" onclick="document.getElementById('file-input').click()">📤 Import JSON</button>
        <input type="file" id="file-input" style="display:none" accept=".json" onchange="importFromFile(event)">
      </div>
    </div>
    
    <div id="history-list"></div>
  </div>

  <!-- Rest Timer Bar -->
  <div id="timer-bar">
    <div class="timer-info">
      <span class="timer-label" id="timer-label">Rest Timer</span>
      <span class="timer-time" id="timer-display">00:00</span>
    </div>
    <div class="timer-controls">
      <button class="btn-timer" onclick="adjustTimer(+30)">+30s</button>
      <button class="btn-timer" onclick="stopTimer()">Skip</button>
    </div>
  </div>

  <!-- Add Exercise Modal -->
  <div class="modal-overlay" id="modal-add-ex">
    <div class="modal-card">
      <div class="modal-title">Add Exercise</div>
      <button class="modal-btn primary" onclick="confirmAddExercise('strength')">Strength Exercise (Sets & Weights)</button>
      <button class="modal-btn secondary" onclick="confirmAddExercise('warmup')">Warmup / Cardio Note</button>
      <button class="modal-btn cancel" onclick="closeModal('modal-add-ex')">Cancel</button>
    </div>
  </div>

  <!-- Add Template Modal -->
  <div class="modal-overlay" id="modal-add-template">
    <div class="modal-card">
      <div class="modal-title">Create New Template</div>
      <input type="text" id="new-template-name" style="background:#2a2a2a; border:1px solid var(--border); padding:8px; border-radius:6px; color:#fff;" placeholder="Template Name">
      <button class="modal-btn primary" onclick="confirmCreateTemplate('scratch')">Create From Scratch</button>
      <button class="modal-btn secondary" onclick="confirmCreateTemplate('duplicate')">Duplicate Current Workout</button>
      <button class="modal-btn cancel" onclick="closeModal('modal-add-template')">Cancel</button>
    </div>
  </div>

  <!-- Edit History Modal -->
  <div class="modal-overlay" id="modal-edit-history">
    <div class="modal-card" style="max-width: 500px; max-height: 90vh; overflow-y: auto;">
      <div class="modal-title">✎ Edit History Entry</div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <label style="font-size:0.75rem; color:var(--subtext);">Date & Time:
          <input type="text" id="edit-hist-date" style="width:100%; background:#2a2a2a; border:1px solid var(--border); padding:8px; border-radius:6px; color:#fff; font-size:0.85rem;">
        </label>
        <div style="display:flex; gap:8px;">
          <label style="flex:1; font-size:0.75rem; color:var(--subtext);">Duration (min):
            <input type="number" id="edit-hist-duration" style="width:100%; background:#2a2a2a; border:1px solid var(--border); padding:8px; border-radius:6px; color:#fff; font-size:0.85rem;">
          </label>
          <label style="flex:2; font-size:0.75rem; color:var(--subtext);">Template / Title:
            <input type="text" id="edit-hist-template" style="width:100%; background:#2a2a2a; border:1px solid var(--border); padding:8px; border-radius:6px; color:#fff; font-size:0.85rem;">
          </label>
        </div>
        <div style="font-size:0.8rem; font-weight:700; color:var(--accent); margin-top:6px;">Exercises & Sets:</div>
        <div id="edit-hist-exercises-container"></div>
        <button class="btn-small" onclick="addHistExercise()" style="margin-bottom:8px;">+ Add Exercise to History</button>
      </div>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="modal-btn primary" style="flex:1;" onclick="saveHistoryEdit()">Save Changes</button>
        <button class="modal-btn cancel" style="flex:1;" onclick="closeModal('modal-edit-history')">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. FIREBASE CONFIGURATION
    // ==========================================
    const firebaseConfig = {    
      apiKey: "AIzaSyDR1B2UwgyKwU2GmFc8XuqbtaV5PzuNIi0",    
      authDomain: "workouts-json.firebaseapp.com",    
      databaseURL: "https://workouts-json-default-rtdb.europe-west1.firebasedatabase.app",    
      projectId: "workouts-json",    
      storageBucket: "workouts-json.firebasestorage.app",    
      messagingSenderId: "103790271171",    
      appId: "1:103790271171:web:4ea41ee83a566526bea076"};

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    firebase.auth().signInAnonymously().catch(err => console.error("Auth error:", err));

    // ==========================================
    // 2. DEFAULT WORKOUT DATA & STATE
    // ==========================================
    const defaultTemplates = {
      "Pull-ups": [
        { name: "Warmup Routine", cardio: true, text: "5 min shoulder mobility\nLight bands" },
        {
          name: "Pull-ups (Bodyweight)",
          comment: "Shoulders down, chest open",
          sets: [
            { weight: 0, reps: 5, pause: 2, done: false },
            { weight: 0, reps: 22, pause: 3, done: false }
          ]
        },
        {
          name: "Weights 15kg",
          comment: "",
          sets: [
            { weight: 15, reps: 5, pause: 3, done: false },
            { weight: 15, reps: 5, pause: 3, done: false }
          ]
        }
      ]
    };

    let workoutTemplates = JSON.parse(localStorage.getItem('workoutTemplates')) || defaultTemplates;
    let activeTemplateKey = localStorage.getItem('activeTemplateKey') || Object.keys(workoutTemplates)[0];
    let workoutHistory = JSON.parse(localStorage.getItem('workoutHistory')) || [];

    // Restore active workout status and start time from LocalStorage across page refreshes
    let workoutActive = localStorage.getItem('workoutActive') === 'true';
    let savedStartTime = localStorage.getItem('workoutStartTime');
    let workoutStartTime = savedStartTime ? Number(savedStartTime) : null;

    let timerTargetEnd = null;
    let timerTotalSec = 0;
    let activeTimerExIdx = null;
    let audioCtx = null;
    let alarmPlaying = false;
    let wakeLock = null;

    // Web Worker for background-resilient timers
    const timerWorkerCode = `
      let interval = null;
      onmessage = function(e) {
        if (e.data === 'start') {
          if (interval) clearInterval(interval);
          interval = setInterval(() => postMessage('tick'), 250);
        } else if (e.data === 'stop') {
          if (interval) clearInterval(interval);
        }
      };
    `;
    const timerWorker = new Worker(URL.createObjectURL(new Blob([timerWorkerCode], { type: 'application/javascript' })));
    timerWorker.onmessage = function() {
      updateTimerLoop();
    };

    function sanitizeData() {
      Object.keys(workoutTemplates).forEach(key => {
        workoutTemplates[key].forEach(ex => {
          if (ex.comment === undefined) ex.comment = "";
          delete ex.startTime;
          delete ex.endTime;
          delete ex.recordedTimings;
          if (ex.sets) {
            ex.sets.forEach(s => {
              delete s.note;
              if (s.pause >= 15) s.pause = Math.round((s.pause / 60) * 10) / 10;
            });
          }
        });
      });
    }
    sanitizeData();

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // ==========================================
    // 3. FIREBASE REALTIME SYNC & LOCAL STORAGE
    // ==========================================
    let isRemoteUpdate = false;
    function syncToFirebase() {
      const statusEl = document.getElementById('sync-status');
      if (statusEl) statusEl.innerText = "🔥 Firebase: Saving...";
      
      const payload = { workoutTemplates, activeTemplateKey, workoutHistory, updatedAt: Date.now() };

      db.ref('gymTrackerData').set(payload).then(() => {
        if (statusEl) statusEl.innerText = "🔥 Firebase: Synced";
      }).catch((err) => {
        if (statusEl) statusEl.innerText = "🔥 Firebase: Sync Error";
      });
    }

    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        db.ref('gymTrackerData').on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            isRemoteUpdate = true;
            if (data.workoutTemplates) workoutTemplates = data.workoutTemplates;
            if (data.activeTemplateKey) activeTemplateKey = data.activeTemplateKey;
            if (data.workoutHistory) workoutHistory = data.workoutHistory;

            sanitizeData();
            saveStateToLocal();
            renderTracker();
            if (document.getElementById('view-history').style.display !== 'none') renderHistory();
            document.getElementById('sync-status').innerText = "🔥 Firebase: Synced";
            isRemoteUpdate = false;
          } else {
            syncToFirebase();
          }
        });
      }
    });

    function saveStateToLocal() {
      localStorage.setItem('workoutTemplates', JSON.stringify(workoutTemplates));
      localStorage.setItem('activeTemplateKey', activeTemplateKey);
      localStorage.setItem('workoutHistory', JSON.stringify(workoutHistory));
      localStorage.setItem('workoutActive', workoutActive);
      if (workoutStartTime) {
        localStorage.setItem('workoutStartTime', workoutStartTime);
      } else {
        localStorage.removeItem('workoutStartTime');
      }
    }

    function saveState() {
      saveStateToLocal();
      if (!isRemoteUpdate) syncToFirebase();
    }

    // ==========================================
    // 4. AUDIO ENGINE & LOCKSCREEN RESILIENCE
    // ==========================================
    function initAudio() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(0);
        osc.stop(audioCtx.currentTime + 0.01);
      } catch (e) {
        console.error("Audio init error:", e);
      }
    }
    document.addEventListener('click', initAudio);
    document.addEventListener('touchstart', initAudio);

    // Audio Data URI synth generator for lockscreen fallback
    function createBeepWavUri(freq = 880, durationMs = 400) {
      const sampleRate = 22050;
      const numSamples = Math.floor(sampleRate * (durationMs / 1000));
      const buffer = new Uint8Array(44 + numSamples);
      const writeString = (offset, str) => { for (let i = 0; i < str.length; i++) buffer[offset + i] = str.charCodeAt(i); };
      const write32 = (offset, val) => {
        buffer[offset] = val & 0xff; buffer[offset+1] = (val >> 8) & 0xff;
        buffer[offset+2] = (val >> 16) & 0xff; buffer[offset+3] = (val >> 24) & 0xff;
      };
      const write16 = (offset, val) => {
        buffer[offset] = val & 0xff; buffer[offset+1] = (val >> 8) & 0xff;
      };
      writeString(0, 'RIFF'); write32(4, 36 + numSamples); writeString(8, 'WAVE');
      writeString(12, 'fmt '); write32(16, 16); write16(20, 1); write16(22, 1);
      write32(24, sampleRate); write32(28, sampleRate); write16(32, 1); write16(34, 8);
      writeString(36, 'data'); write32(40, numSamples);
      for (let i = 0; i < numSamples; i++) {
        const t = i / sampleRate;
        const sample = Math.sin(2 * Math.PI * freq * t);
        buffer[44 + i] = Math.floor((sample + 1) * 127.5);
      }
      let binary = '';
      for (let i = 0; i < buffer.length; i++) binary += String.fromCharCode(buffer[i]);
      return 'data:audio/wav;base64,' + btoa(binary);
    }

    const alarmAudioUriHigh = createBeepWavUri(1046.5, 350);
    const alarmAudioUriLow = createBeepWavUri(880, 350);

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch (err) {
        console.log('Wake Lock error:', err);
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) { wakeLock.release(); wakeLock = null; }
    }

    function requestNotificationPermission() {
      if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
        Notification.requestPermission();
      }
    }

    function triggerLockscreenNotification() {
      if ("Notification" in window && Notification.permission === "granted") {
        try {
          new Notification("🔥 Rest Timer Finished!", {
            body: "Time is up! Ready for your next set.",
            tag: "rest-timer",
            renotify: true,
            requireInteraction: true
          });
        } catch (e) {
          console.error("Notification error:", e);
        }
      }
    }

    function playLoudAlarm() {
      initAudio();
      alarmPlaying = true;
      let count = 0;

      function pulse() {
        if (!alarmPlaying || count >= 6) return;

        // Web Audio API pulse
        try {
          if (audioCtx) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(count % 2 === 0 ? 880 : 1046.5, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.9, audioCtx.currentTime);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.35);
          }
        } catch (e) {
          console.error("Audio synth error:", e);
        }

        // HTML5 Audio fallback
        try {
          const audioEl = new Audio(count % 2 === 0 ? alarmAudioUriLow : alarmAudioUriHigh);
          audioEl.play().catch(() => {});
        } catch (e) {}

        // Vibration
        if ("vibrate" in navigator) {
          try { navigator.vibrate([300, 100, 300]); } catch(e){}
        }

        count++;
        setTimeout(pulse, 450);
      }
      pulse();
    }

    // Reactivate timer/sound when user unlocks screen or returns to page
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (timerTargetEnd) updateTimerLoop();
      }
    });
    window.addEventListener('pageshow', () => {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      if (timerTargetEnd) updateTimerLoop();
    });

    function startTimer(minutes, exIdx = null) {
      initAudio();
      requestNotificationPermission();
      requestWakeLock();

      const seconds = Math.round(minutes * 60);
      if (seconds <= 0) return;

      activeTimerExIdx = exIdx;
      alarmPlaying = false;
      timerTotalSec = seconds;
      timerTargetEnd = Date.now() + (seconds * 1000);

      const timerBar = document.getElementById('timer-bar');
      timerBar.classList.remove('timer-done', 'timer-warning');
      document.getElementById('timer-label').innerText = "RESTING...";

      timerWorker.postMessage('start');
      updateTimerLoop();
    }

    function markTimerExerciseFinished() {
      if (activeTimerExIdx !== null && workoutTemplates[activeTemplateKey][activeTimerExIdx]) {
        workoutTemplates[activeTemplateKey][activeTimerExIdx].completedAt = Date.now();
        saveStateToLocal();
      }
    }

    function updateTimerLoop() {
      if (!timerTargetEnd) return;

      const remainingMs = timerTargetEnd - Date.now();
      const secLeft = Math.ceil(remainingMs / 1000);
      const timerBar = document.getElementById('timer-bar');

      markTimerExerciseFinished();

      if (secLeft > 10) {
        timerBar.classList.remove('timer-done', 'timer-warning');
        const pct = Math.min(100, Math.max(0, ((timerTotalSec - secLeft) / timerTotalSec) * 100));
        timerBar.style.background = `linear-gradient(to right, var(--timer-progress) ${pct}%, var(--timer-bg) ${pct}%)`;

        const m = Math.floor(secLeft / 60).toString().padStart(2, '0');
        const s = (secLeft % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').innerText = `${m}:${s}`;
      } else if (secLeft > 0) {
        timerBar.classList.remove('timer-done');
        timerBar.classList.add('timer-warning');
        const pct = Math.min(100, Math.max(0, ((timerTotalSec - secLeft) / timerTotalSec) * 100));
        timerBar.style.background = `linear-gradient(to right, var(--warning) ${pct}%, var(--timer-bg) ${pct}%)`;

        const m = Math.floor(secLeft / 60).toString().padStart(2, '0');
        const s = (secLeft % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').innerText = `${m}:${s}`;
      } else {
        timerBar.classList.remove('timer-warning');
        timerBar.classList.add('timer-done');
        timerBar.style.background = '#3b1111';
        document.getElementById('timer-display').innerText = "00:00";
        document.getElementById('timer-label').innerText = "TIME IS UP!";

        if (!alarmPlaying) {
          playLoudAlarm();
          triggerLockscreenNotification();
        }
      }
    }

    function adjustTimer(sec) {
      if (!timerTargetEnd) return;
      timerTargetEnd += sec * 1000;
      timerTotalSec += sec;
      updateTimerLoop();
    }

    function stopTimer() {
      markTimerExerciseFinished();
      timerWorker.postMessage('stop');
      timerTargetEnd = null;
      activeTimerExIdx = null;
      alarmPlaying = false;
      releaseWakeLock();

      const timerBar = document.getElementById('timer-bar');
      timerBar.classList.remove('timer-done', 'timer-warning');
      timerBar.style.background = 'var(--timer-bg)';
      document.getElementById('timer-display').innerText = "00:00";
      document.getElementById('timer-label').innerText = "REST TIMER";
    }

    // ==========================================
    // 5. TIMING CALCULATIONS
    // ==========================================
    function calculateWorkoutTimings() {
      const currentList = workoutTemplates[activeTemplateKey] || [];
      let totalPlannedRestMin = 0;

      currentList.forEach(ex => {
        if (!ex.cardio && ex.sets) {
          ex.sets.forEach(set => {
            totalPlannedRestMin += (Number(set.pause) || 0);
          });
        }
      });

      const lastSession = workoutHistory.find(h => h.templateName === activeTemplateKey);
      let estWorkoutStr = "N/A";

      if (lastSession) {
        if (lastSession.totalDurationMin) {
          estWorkoutStr = `${lastSession.totalDurationMin}m`;
        } else if (lastSession.startTime && lastSession.endTime && lastSession.startTime !== 'N/A') {
          estWorkoutStr = `${lastSession.startTime} ➔ ${lastSession.endTime}`;
        }
      }

      document.getElementById('sum-planned-rest').innerText = `${Math.round(totalPlannedRestMin * 10) / 10}m`;
      document.getElementById('sum-total-workout').innerText = estWorkoutStr;
    }

    // ==========================================
    // 6. WORKOUT CONTROL FLOW
    // ==========================================
    function toggleWorkoutStart() {
      workoutActive = !workoutActive;

      if (workoutActive) {
        workoutStartTime = Date.now();
        // Clear old checks when starting fresh session
        const currentList = workoutTemplates[activeTemplateKey] || [];
        currentList.forEach(ex => {
          if (ex.sets) ex.sets.forEach(s => s.done = false);
        });
      } else {
        workoutStartTime = null;
      }
      saveState();
      renderTracker();
    }

    function finishWorkout() {
      if (!workoutActive && !confirm("Workout is not marked as started. Finish anyway and save to history?")) {
        return;
      }

      const now = new Date();
      const currentList = workoutTemplates[activeTemplateKey] || [];

      const historyItem = {
        id: Date.now(),
        templateName: activeTemplateKey,
        dateStr: now.toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
        timestamp: Date.now(),
        startTime: workoutStartTime ? new Date(workoutStartTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'N/A',
        endTime: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        totalDurationMin: workoutStartTime ? Math.max(1, Math.round((Date.now() - workoutStartTime) / 60000)) : 0,
        exercises: JSON.parse(JSON.stringify(currentList))
      };

      workoutHistory.unshift(historyItem);

      // Reset checked states for next session
      currentList.forEach(ex => {
        if (ex.sets) ex.sets.forEach(s => s.done = false);
      });

      workoutActive = false;
      workoutStartTime = null;

      saveState();
      stopTimer();
      alert("Workout saved to history!");
      switchTab('history');
    }

    function resetWorkout() {
      if (confirm("Reset all checks and uncheck all sets?")) {
        const currentList = workoutTemplates[activeTemplateKey] || [];
        currentList.forEach(ex => {
          if (ex.sets) ex.sets.forEach(s => s.done = false);
        });
        saveState();
        renderTracker();
      }
    }

    function copyWorkoutAsText() {
      const now = new Date();
      const dateStr = now.toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
      const currentList = workoutTemplates[activeTemplateKey] || [];

      let text = `🏋️ ${activeTemplateKey} - ${dateStr}\n`;
      if (workoutStartTime) {
        text += `⏱️ Time: ${new Date(workoutStartTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} ➔ ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}\n`;
      }
      text += `------------------------------\n`;

      currentList.forEach((ex) => {
        text += `\n🔹 ${ex.name}${ex.cardio ? ' (Warmup)' : ''}\n`;
        if (ex.cardio && ex.text) {
          text += `${ex.text}\n`;
        } else {
          if (ex.comment) text += `Note: ${ex.comment}\n`;
          if (ex.sets) {
            ex.sets.forEach((s) => {
              text += `  • ${s.weight}kg × ${s.reps} reps | ${s.pause}m rest ${s.done ? '[✓]' : ''}\n`;
            });
          }
        }
      });

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => alert("Workout template copied to clipboard!"));
      } else {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        alert("Workout template copied to clipboard!");
      }
    }

    // ==========================================
    // 7. MODALS CONTROL
    // ==========================================
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function showAddExModal() { openModal('modal-add-ex'); }

    function confirmAddExercise(type) {
      closeModal('modal-add-ex');
      const name = prompt("Enter Exercise Name:", type === 'warmup' ? "Warmup Routine" : "New Exercise");
      if (!name) return;

      if (type === 'warmup') {
        workoutTemplates[activeTemplateKey].push({ name, cardio: true, text: "5 min warmup" });
      } else {
        workoutTemplates[activeTemplateKey].push({
          name, comment: "",
          sets: [{ weight: 10, reps: 10, pause: 2, done: false }]
        });
      }
      saveState();
      renderTracker();
    }

    function showNewTemplateModal() { openModal('modal-add-template'); }

    function confirmCreateTemplate(mode) {
      const nameInput = document.getElementById('new-template-name');
      const name = nameInput.value.trim();
      if (!name) { alert("Please enter a template name."); return; }
      if (workoutTemplates[name]) { alert("Template already exists."); return; }

      closeModal('modal-add-template');
      nameInput.value = '';

      if (mode === 'duplicate') {
        workoutTemplates[name] = JSON.parse(JSON.stringify(workoutTemplates[activeTemplateKey]));
      } else {
        workoutTemplates[name] = [
          { name: "Sample Exercise", comment: "", sets: [{ weight: 0, reps: 10, pause: 2, done: false }] }
        ];
      }

      activeTemplateKey = name;
      saveState();
      renderTracker();
    }

    function changeTemplate(key) {
      if (workoutTemplates[key]) {
        activeTemplateKey = key;
        saveState();
        renderTracker();
      }
    }

    function renameCurrentTemplate() {
      const newName = prompt("Rename template:", activeTemplateKey);
      if (!newName || !newName.trim() || newName.trim() === activeTemplateKey) return;
      const trimmed = newName.trim();
      if (workoutTemplates[trimmed]) {
        alert("A template with this name already exists.");
        return;
      }
      workoutTemplates[trimmed] = workoutTemplates[activeTemplateKey];
      delete workoutTemplates[activeTemplateKey];
      activeTemplateKey = trimmed;
      saveState();
      renderTracker();
    }

    function deleteCurrentTemplate() {
      const keys = Object.keys(workoutTemplates);
      if (keys.length <= 1) {
        alert("You must keep at least one template.");
        return;
      }
      if (confirm(`Delete template "${activeTemplateKey}"?`)) {
        delete workoutTemplates[activeTemplateKey];
        activeTemplateKey = Object.keys(workoutTemplates)[0];
        saveState();
        renderTracker();
      }
    }

    // ==========================================
    // 8. CORE TRACKER & EXERCISE MANAGEMENT
    // ==========================================
    function toggleSet(exIdx, setIdx) {
      initAudio();

      if (!workoutActive) {
        workoutActive = true;
        workoutStartTime = Date.now();
        saveStateToLocal();
      }

      const ex = workoutTemplates[activeTemplateKey][exIdx];
      const set = ex.sets[setIdx];
      set.done = !set.done;

      if (set.done) {
        ex.completedAt = Date.now();
        if (set.pause > 0) {
          startTimer(set.pause, exIdx);
        }
      }

      saveState();
      renderTracker();
    }

    function updateVal(exIdx, setIdx, field, value) {
      if (workoutTemplates[activeTemplateKey][exIdx]?.sets[setIdx]) {
        workoutTemplates[activeTemplateKey][exIdx].sets[setIdx][field] = Number(value);
        saveStateToLocal();
        calculateWorkoutTimings();
      }
    }

    function updateExComment(exIdx, value) {
      if (workoutTemplates[activeTemplateKey][exIdx]) {
        workoutTemplates[activeTemplateKey][exIdx].comment = value;
        saveStateToLocal();
      }
    }

    function updateCardioText(exIdx, value) {
      if (workoutTemplates[activeTemplateKey][exIdx]) {
        workoutTemplates[activeTemplateKey][exIdx].text = value;
        saveStateToLocal();
      }
    }

    function updateExName(exIdx, value) {
      if (workoutTemplates[activeTemplateKey][exIdx]) {
        workoutTemplates[activeTemplateKey][exIdx].name = value;
        saveStateToLocal();
      }
    }

    function addSet(exIdx) {
      const ex = workoutTemplates[activeTemplateKey][exIdx];
      if (!ex || !ex.sets) return;
      const lastSet = ex.sets[ex.sets.length - 1];
      ex.sets.push({
        weight: lastSet ? lastSet.weight : 10,
        reps: lastSet ? lastSet.reps : 10,
        pause: lastSet ? lastSet.pause : 2,
        done: false
      });
      saveState();
      renderTracker();
    }

    function deleteSet(exIdx, setIdx) {
      const ex = workoutTemplates[activeTemplateKey][exIdx];
      if (!ex || !ex.sets) return;
      ex.sets.splice(setIdx, 1);
      saveState();
      renderTracker();
    }

    function deleteExercise(exIdx) {
      const ex = workoutTemplates[activeTemplateKey][exIdx];
      if (!ex) return;
      if (confirm(`Delete exercise "${ex.name}"?`)) {
        workoutTemplates[activeTemplateKey].splice(exIdx, 1);
        saveState();
        renderTracker();
      }
    }

    function moveExercise(exIdx, direction) {
      const list = workoutTemplates[activeTemplateKey];
      if (!list) return;
      const targetIdx = exIdx + direction;
      if (targetIdx < 0 || targetIdx >= list.length) return;
      const temp = list[exIdx];
      list[exIdx] = list[targetIdx];
      list[targetIdx] = temp;
      saveState();
      renderTracker();
    }

    // ==========================================
    // 9. RENDER TRACKER
    // ==========================================
    function renderTracker() {
      calculateWorkoutTimings();

      const selectEl = document.getElementById('template-select');
      if (selectEl) {
        selectEl.innerHTML = '';
        Object.keys(workoutTemplates).forEach(key => {
          const opt = document.createElement('option');
          opt.value = key;
          opt.innerText = key;
          if (key === activeTemplateKey) opt.selected = true;
          selectEl.appendChild(opt);
        });
      }

      const banner = document.getElementById('start-banner');
      const info = document.getElementById('start-info');
      const btn = document.getElementById('btn-start-toggle');

      if (workoutActive) {
        banner.classList.add('active');
        const startStr = workoutStartTime ? new Date(workoutStartTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Active';
        info.innerText = `Active since ${startStr}`;
        btn.innerText = "Cancel Workout";
      } else {
        banner.classList.remove('active');
        info.innerText = "Workout Status: Not Started";
        btn.innerText = "Start Workout";
      }

      const container = document.getElementById('workout-list');
      if (!container) return;
      container.innerHTML = '';

      const currentList = workoutTemplates[activeTemplateKey] || [];

      if (currentList.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--subtext); padding:20px;">No exercises in this template. Click "+ Add Exercise" below.</div>';
        return;
      }

      currentList.forEach((ex, exIdx) => {
        const card = document.createElement('div');
        card.className = 'card';

        let cardContent = `
          <div class="card-header">
            <input type="text" class="card-title" value="${escapeHtml(ex.name)}" onchange="updateExName(${exIdx}, this.value)" style="background:transparent; border:none; border-bottom:1px solid transparent; font-size:1rem; font-weight:700; color:#fff; width:65%;" onfocus="this.style.borderColor='var(--active)'" onblur="this.style.borderColor='transparent'">
            <div class="card-controls">
              <button class="icon-btn" title="Move Up" onclick="moveExercise(${exIdx}, -1)">▲</button>
              <button class="icon-btn" title="Move Down" onclick="moveExercise(${exIdx}, 1)">▼</button>
              <button class="icon-btn danger" title="Delete Exercise" onclick="deleteExercise(${exIdx})">🗑</button>
            </div>
          </div>
        `;

        if (ex.cardio) {
          cardContent += `
            <textarea class="note-textarea" placeholder="Warmup notes or duration..." onchange="updateCardioText(${exIdx}, this.value)">${escapeHtml(ex.text || '')}</textarea>
          `;
        } else {
          cardContent += `
            <textarea class="ex-comment-input" placeholder="Exercise notes / form cues..." onchange="updateExComment(${exIdx}, this.value)">${escapeHtml(ex.comment || '')}</textarea>
          `;

          if (ex.sets) {
            ex.sets.forEach((set, setIdx) => {
              cardContent += `
                <div class="set-row ${set.done ? 'completed' : ''}">
                  <div style="font-size:0.75rem; color:var(--subtext); text-align:center; font-weight:600;">#${setIdx + 1}</div>
                  <div class="val-box">
                    <span class="val-label">WEIGHT (KG)</span>
                    <input type="number" class="val-input" value="${set.weight}" onchange="updateVal(${exIdx}, ${setIdx}, 'weight', this.value)">
                  </div>
                  <div class="val-box">
                    <span class="val-label">REPS</span>
                    <input type="number" class="val-input" value="${set.reps}" onchange="updateVal(${exIdx}, ${setIdx}, 'reps', this.value)">
                  </div>
                  <div class="val-box">
                    <span class="val-label">REST (MIN)</span>
                    <input type="number" step="0.5" class="val-input" value="${set.pause}" onchange="updateVal(${exIdx}, ${setIdx}, 'pause', this.value)">
                  </div>
                  <button class="check-btn" onclick="toggleSet(${exIdx}, ${setIdx})">${set.done ? '✓' : ''}</button>
                  <button class="icon-btn danger" style="width:24px; height:24px; font-size:0.7rem;" title="Delete Set" onclick="deleteSet(${exIdx}, ${setIdx})">×</button>
                </div>
              `;
            });
          }

          cardContent += `
            <div class="card-actions">
              <button class="btn-link" onclick="addSet(${exIdx})">+ Add Set</button>
            </div>
          `;
        }

        card.innerHTML = cardContent;
        container.appendChild(card);
      });
    }

    // ==========================================
    // 10. HISTORY & MANUAL EDITING
    // ==========================================
    function renderHistory() {
      const container = document.getElementById('history-list');
      if (!container) return;
      container.innerHTML = '';

      if (!workoutHistory || workoutHistory.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--subtext); padding:20px;">No workout history recorded yet.</div>';
        return;
      }

      workoutHistory.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'history-item';

        let exercisesHtml = '';
        if (item.exercises) {
          item.exercises.forEach(ex => {
            exercisesHtml += `<div class="history-ex-title">${escapeHtml(ex.name)}</div>`;
            if (ex.comment) {
              exercisesHtml += `<div class="history-ex-comment">${escapeHtml(ex.comment)}</div>`;
            }
            if (ex.cardio && ex.text) {
              exercisesHtml += `<div class="history-set-line">${escapeHtml(ex.text)}</div>`;
            } else if (ex.sets) {
              ex.sets.forEach((s, sIdx) => {
                exercisesHtml += `<div class="history-set-line">Set ${sIdx + 1}: ${s.weight}kg × ${s.reps} reps ${s.done ? '✓' : ''}</div>`;
              });
            }
          });
        }

        card.innerHTML = `
          <div class="history-header">
            <span class="history-date">${escapeHtml(item.templateName || 'Workout')} - ${escapeHtml(item.dateStr || '')}</span>
            <div>
              <button class="btn-small" style="padding:4px 8px; margin-right:4px;" onclick="editHistoryItem(${index})">✎ Edit</button>
              <button class="btn-small" style="padding:4px 8px; color:var(--danger); border-color:var(--danger);" onclick="deleteHistoryItem(${index})">🗑</button>
            </div>
          </div>
          <div class="history-duration">⏱️ Duration: ${item.totalDurationMin || 0} min (${item.startTime || 'N/A'} ➔ ${item.endTime || 'N/A'})</div>
          <div class="history-details">${exercisesHtml}</div>
        `;

        container.appendChild(card);
      });
    }

    let editingHistoryIndex = null;
    let historyEditingCopy = null;

    function editHistoryItem(index) {
      editingHistoryIndex = index;
      historyEditingCopy = JSON.parse(JSON.stringify(workoutHistory[index]));

      document.getElementById('edit-hist-date').value = historyEditingCopy.dateStr || '';
      document.getElementById('edit-hist-duration').value = historyEditingCopy.totalDurationMin || 0;
      document.getElementById('edit-hist-template').value = historyEditingCopy.templateName || '';

      renderHistoryEditExercises();
      openModal('modal-edit-history');
    }

    function renderHistoryEditExercises() {
      const container = document.getElementById('edit-hist-exercises-container');
      if (!container || !historyEditingCopy) return;
      container.innerHTML = '';

      const exercises = historyEditingCopy.exercises || [];

      exercises.forEach((ex, exIdx) => {
        const card = document.createElement('div');
        card.style.cssText = "background:#1e1e1e; border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:10px;";

        let html = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; gap:6px;">
            <input type="text" value="${escapeHtml(ex.name || '')}" onchange="historyEditingCopy.exercises[${exIdx}].name = this.value" style="background:#2a2a2a; border:1px solid var(--border); color:#fff; padding:6px; border-radius:6px; font-weight:bold; flex:1; font-size:0.85rem;">
            <button onclick="deleteHistExercise(${exIdx})" style="background:transparent; border:1px solid var(--danger); color:var(--danger); padding:4px 8px; border-radius:6px; font-size:0.75rem; cursor:pointer;">Delete</button>
          </div>
        `;

        if (ex.cardio) {
          html += `<textarea onchange="historyEditingCopy.exercises[${exIdx}].text = this.value" style="width:100%; background:#121212; color:#7dd3fc; border:1px solid #333; padding:6px; border-radius:6px; font-size:0.8rem; font-style:italic;">${escapeHtml(ex.text || '')}</textarea>`;
        } else {
          html += `<input type="text" value="${escapeHtml(ex.comment || '')}" placeholder="Exercise note" onchange="historyEditingCopy.exercises[${exIdx}].comment = this.value" style="width:100%; background:#121212; color:#a0a0a0; border:1px solid #333; padding:4px 6px; border-radius:6px; font-size:0.75rem; font-style:italic; margin-bottom:6px;">`;

          html += `<div style="display:flex; flex-direction:column; gap:4px; margin-bottom:6px;">`;
          (ex.sets || []).forEach((set, setIdx) => {
            html += `
              <div style="display:grid; grid-template-columns: 1fr 1fr 32px; gap:6px; align-items:center;">
                <div style="background:#2a2a2a; padding:2px 4px; border-radius:4px; display:flex; align-items:center;">
                  <span style="font-size:0.65rem; color:#888; margin-right:4px;">kg:</span>
                  <input type="number" value="${set.weight}" onchange="historyEditingCopy.exercises[${exIdx}].sets[${setIdx}].weight = Number(this.value)" style="width:100%; background:transparent; border:none; color:#fff; font-weight:bold; font-size:0.8rem;">
                </div>
                <div style="background:#2a2a2a; padding:2px 4px; border-radius:4px; display:flex; align-items:center;">
                  <span style="font-size:0.65rem; color:#888; margin-right:4px;">reps:</span>
                  <input type="number" value="${set.reps}" onchange="historyEditingCopy.exercises[${exIdx}].sets[${setIdx}].reps = Number(this.value)" style="width:100%; background:transparent; border:none; color:#fff; font-weight:bold; font-size:0.8rem;">
                </div>
                <button onclick="deleteHistSet(${exIdx}, ${setIdx})" style="background:transparent; border:1px solid var(--danger); color:var(--danger); border-radius:4px; cursor:pointer; font-size:0.8rem; height:28px;">×</button>
              </div>
            `;
          });
          html += `</div>`;
          html += `<button onclick="addHistSet(${exIdx})" style="background:#2a2a2a; color:var(--active); border:1px dashed var(--border); padding:4px 8px; border-radius:6px; font-size:0.75rem; cursor:pointer;">+ Add Set</button>`;
        }

        card.innerHTML = html;
        container.appendChild(card);
      });
    }

    function addHistSet(exIdx) {
      if (!historyEditingCopy || !historyEditingCopy.exercises[exIdx]) return;
      const sets = historyEditingCopy.exercises[exIdx].sets || [];
      const lastSet = sets[sets.length - 1];
      sets.push({
        weight: lastSet ? lastSet.weight : 10,
        reps: lastSet ? lastSet.reps : 10,
        pause: lastSet ? lastSet.pause : 2,
        done: true
      });
      historyEditingCopy.exercises[exIdx].sets = sets;
      renderHistoryEditExercises();
    }

    function deleteHistSet(exIdx, setIdx) {
      if (!historyEditingCopy || !historyEditingCopy.exercises[exIdx]) return;
      historyEditingCopy.exercises[exIdx].sets.splice(setIdx, 1);
      renderHistoryEditExercises();
    }

    function deleteHistExercise(exIdx) {
      if (!historyEditingCopy) return;
      historyEditingCopy.exercises.splice(exIdx, 1);
      renderHistoryEditExercises();
    }

    function addHistExercise() {
      if (!historyEditingCopy) return;
      const name = prompt("Enter Exercise Name:", "New Exercise");
      if (!name) return;
      historyEditingCopy.exercises.push({
        name, comment: "", sets: [{ weight: 10, reps: 10, pause: 2, done: true }]
      });
      renderHistoryEditExercises();
    }

    function saveHistoryEdit() {
      if (editingHistoryIndex === null || !historyEditingCopy) return;

      historyEditingCopy.dateStr = document.getElementById('edit-hist-date').value;
      historyEditingCopy.totalDurationMin = Number(document.getElementById('edit-hist-duration').value);
      historyEditingCopy.templateName = document.getElementById('edit-hist-template').value;

      workoutHistory[editingHistoryIndex] = historyEditingCopy;
      saveState();
      closeModal('modal-edit-history');
      renderHistory();
      editingHistoryIndex = null;
      historyEditingCopy = null;
    }

    function deleteHistoryItem(index) {
      if (confirm("Delete this workout entry from history?")) {
        workoutHistory.splice(index, 1);
        saveState();
        renderHistory();
      }
    }

    // ==========================================
    // 11. NAVIGATION & DATA IMPORT/EXPORT
    // ==========================================
    function switchTab(tab) {
      const trackerTabBtn = document.getElementById('tab-tracker-btn');
      const historyTabBtn = document.getElementById('tab-history-btn');
      const viewTracker = document.getElementById('view-tracker');
      const viewHistory = document.getElementById('view-history');
      const templateBar = document.getElementById('template-bar');

      if (tab === 'tracker') {
        trackerTabBtn.classList.add('active');
        historyTabBtn.classList.remove('active');
        viewTracker.style.display = 'block';
        viewHistory.style.display = 'none';
        templateBar.style.display = 'flex';
        renderTracker();
      } else {
        historyTabBtn.classList.add('active');
        trackerTabBtn.classList.remove('active');
        viewTracker.style.display = 'none';
        viewHistory.style.display = 'block';
        templateBar.style.display = 'none';
        renderHistory();
      }
    }

    function exportToFile() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
        workoutTemplates, activeTemplateKey, workoutHistory
      }, null, 2));
      const dlAnchorElem = document.createElement('a');
      dlAnchorElem.setAttribute("href", dataStr);
      dlAnchorElem.setAttribute("download", `gym_tracker_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(dlAnchorElem);
      dlAnchorElem.click();
      dlAnchorElem.remove();
    }

    function importFromFile(event) {
      const fileReader = new FileReader();
      fileReader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed.workoutTemplates) workoutTemplates = parsed.workoutTemplates;
          if (parsed.activeTemplateKey) activeTemplateKey = parsed.activeTemplateKey;
          if (parsed.workoutHistory) workoutHistory = parsed.workoutHistory;
          sanitizeData();
          saveState();
          renderTracker();
          renderHistory();
          alert("Data imported successfully!");
        } catch (err) {
          alert("Invalid JSON file.");
        }
      };
      if (event.target.files[0]) {
        fileReader.readAsText(event.target.files[0]);
      }
    }

    // ==========================================
    // 12. INITIALIZATION
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
      renderTracker();
    });
  </script>
</body></html>
